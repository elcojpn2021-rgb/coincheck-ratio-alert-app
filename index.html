<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coincheck 売買比率モニター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-buy: #eaf6ef;
    --ink: #14181f;
    --ink-muted: #6b7280;
    --line: #e5e7eb;
    --accent-buy: #1a8f52;
    --accent-ratio: #2563eb;
    --accent-price: #ea8a1f;
    --accent-ref: #a3a8b3;
    --stale-bg: #f0efec;
    --stale-ink: #7a756c;
    --font-head: 'Space Grotesk', -apple-system, 'Hiragino Sans', sans-serif;
    --font-body: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-text-size-adjust: 100%;
  }
  body {
    padding: 20px 16px 48px;
    max-width: 920px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 20px;
  }
  h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--ink-muted);
    font-size: 13px;
    line-height: 1.6;
    margin: 0;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
  }
  .status-row button {
    font-family: var(--font-body);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  .status-row button:active { background: #eef0f2; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
    font-size: 11px;
    color: var(--ink-muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 14px; height: 2px; display: inline-block; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 20px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .card.buy { background: var(--panel-buy); border-color: #cdeadb; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .pair-name {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 17px;
  }
  .state {
    font-size: 12px;
    font-weight: 600;
  }
  .state.buy { color: var(--accent-buy); }
  .state.flat { color: var(--ink-muted); }

  .ratio-row {
    font-family: var(--font-mono);
    font-size: 14px;
    margin: 8px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .ratio-row .buy-num { color: var(--accent-buy); font-weight: 600; }
  .ratio-row .sep { color: var(--ink-muted); margin: 0 4px; }

  .stale-tag {
    display: inline-block;
    font-size: 10px;
    color: var(--stale-ink);
    background: var(--stale-bg);
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 6px;
  }

  canvas { margin-top: 10px; max-width: 100%; }

  .updated {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
    text-align: right;
    margin-top: 6px;
  }

  .empty, .error {
    text-align: center;
    color: var(--ink-muted);
    font-size: 13px;
    padding: 60px 16px;
  }
</style>
</head>
<body>

<header>
  <h1>Coincheck 売買比率モニター</h1>
  <p class="sub">直近の約定実績から算出した銘柄ごとの買い/売り比率。売り比率が買い比率を下回った銘柄はカードが緑になります。</p>
  <div class="status-row">
    <span id="status-text">読み込み中…</span>
    <button id="refresh-btn" type="button">更新</button>
  </div>
  <div class="legend">
    <span><span class="swatch" style="background:var(--accent-ratio)"></span>買い比率(%・左軸)</span>
    <span><span class="swatch" style="background:var(--accent-ref);border-top:1px dashed var(--accent-ref);height:0"></span>50%ライン</span>
    <span><span class="swatch" style="background:var(--accent-price)"></span>価格(円・右軸)</span>
  </div>
</header>

<div id="grid" class="grid"></div>

<script>
  const API_BASE = "https://coincheck-ratio-alert-api.elcojpn2021.workers.dev";
  const AUTO_REFRESH_MS = 5 * 60 * 1000; // 5分ごとに自動更新
  const STALE_HOURS = 6;
  const STALE_MIN_POINTS = 3;

  const chartInstances = {};

  function isNoMovement(history) {
    if (!Array.isArray(history) || history.length < STALE_MIN_POINTS) return false;
    const cutoff = Date.now() - STALE_HOURS * 60 * 60 * 1000;
    const recent = history.filter((h) => new Date(h.t).getTime() >= cutoff);
    if (recent.length < STALE_MIN_POINTS) return false;
    const firstB = recent[0].b;
    return recent.every((h) => h.b === firstB);
  }

  function fmtUpdated(iso) {
    if (!iso) return "-";
    return new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  }

  function render(list) {
    const grid = document.getElementById("grid");

    if (!list.length) {
      grid.innerHTML = '<div class="empty">まだデータがありません。収集が始まるまでお待ちください。</div>';
      return;
    }

    // 既存のChartインスタンスを破棄してから再構築(重複描画防止)
    for (const key in chartInstances) {
      chartInstances[key].destroy();
      delete chartInstances[key];
    }

    grid.innerHTML = list
      .map((s) => {
        const label = s.pair.replace("_jpy", "").toUpperCase();
        if (s.dealerOnly) {
          return `
          <div class="card">
            <div class="card-top">
              <span class="pair-name">${label}/JPY</span>
              <span class="state flat">非対応(販売所のみ)</span>
            </div>
            <div class="ratio-row">買－ ／ 売－</div>
            <canvas id="c-${s.pair}" height="130"></canvas>
            <div class="updated">更新 ${fmtUpdated(s.updatedAt)}</div>
          </div>`;
        }
        const buyPct = (s.buyRatio * 100).toFixed(1);
        const sellPct = (s.sellRatio * 100).toFixed(1);
        const noMovement = isNoMovement(s.history);
        return `
        <div class="card ${s.sellBelowBuy ? "buy" : ""}">
          <div class="card-top">
            <span class="pair-name">${label}/JPY</span>
            <span class="state ${s.sellBelowBuy ? "buy" : "flat"}">${s.sellBelowBuy ? "買い優勢" : "－"}</span>
          </div>
          <div class="ratio-row">
            <span class="buy-num">買${buyPct}%</span><span class="sep">/</span>売${sellPct}%
          </div>
          ${noMovement ? '<span class="stale-tag">動きなし(直近取引少)</span>' : ""}
          <canvas id="c-${s.pair}" height="130"></canvas>
          <div class="updated">更新 ${fmtUpdated(s.updatedAt)}</div>
        </div>`;
      })
      .join("");

    for (const s of list) {
      const el = document.getElementById("c-" + s.pair);
      const history = s.history || [];
      if (!el || history.length === 0) continue;

      const labels = history.map((h) =>
        new Date(h.t).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" })
      );
      const price = history.map((h) => h.p);

      if (s.dealerOnly) {
        // 販売所限定銘柄: 比率データが無いため価格のみの単純なグラフ
        chartInstances[s.pair] = new Chart(el, {
          type: "line",
          data: {
            labels,
            datasets: [
              { label: "価格(円)", data: price, borderColor: "#ea8a1f", backgroundColor: "transparent", pointRadius: 0, borderWidth: 1.5, tension: 0.2 },
            ],
          },
          options: {
            animation: false,
            responsive: true,
            scales: {
              x: { ticks: { maxTicksLimit: 4, font: { size: 9 } } },
              y: { title: { display: true, text: "価格(円)", font: { size: 10 } }, ticks: { font: { size: 9 } } },
            },
            plugins: { legend: { display: false } },
          },
        });
        continue;
      }

      const buy = history.map((h) => (h.b != null ? Math.round(h.b * 1000) / 10 : null));
      const refLine = labels.map(() => 50);
      const hasPrice = price.some((v) => v != null);

      chartInstances[s.pair] = new Chart(el, {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "買い比率%", data: buy, borderColor: "#2563eb", backgroundColor: "transparent", pointRadius: 0, borderWidth: 1.5, tension: 0.2, yAxisID: "y" },
            { label: "50%ライン", data: refLine, borderColor: "#a3a8b3", backgroundColor: "transparent", pointRadius: 0, borderWidth: 1, borderDash: [4, 4], yAxisID: "y" },
            ...(hasPrice ? [{ label: "価格(円)", data: price, borderColor: "#ea8a1f", backgroundColor: "transparent", pointRadius: 0, borderWidth: 1.5, tension: 0.2, yAxisID: "y1" }] : []),
          ],
        },
        options: {
          animation: false,
          responsive: true,
          scales: {
            x: { ticks: { maxTicksLimit: 4, font: { size: 9 } } },
            y: { min: 0, max: 100, position: "left", title: { display: true, text: "買い比率(%)", font: { size: 10 } }, ticks: { font: { size: 9 } } },
            y1: { position: "right", display: hasPrice, title: { display: hasPrice, text: "価格(円)", font: { size: 10 } }, grid: { drawOnChartArea: false }, ticks: { font: { size: 9 } } },
          },
          plugins: { legend: { display: false } },
        },
      });
    }
  }

  async function load() {
    const statusEl = document.getElementById("status-text");
    statusEl.textContent = "更新中…";
    try {
      const res = await fetch(API_BASE + "/api/ratios", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const list = await res.json();
      // 売り比率が低い(買い優勢)順に並べる
      list.sort((a, b) => (a.sellRatio ?? 1) - (b.sellRatio ?? 1));
      render(list);
      statusEl.textContent = "最終取得: " + new Date().toLocaleTimeString("ja-JP", { timeZone: "Asia/Tokyo" });
    } catch (err) {
      statusEl.textContent = "取得に失敗しました";
      document.getElementById("grid").innerHTML =
        '<div class="error">データの取得に失敗しました。しばらくしてから更新ボタンを押してください。</div>';
    }
  }

  document.getElementById("refresh-btn").addEventListener("click", load);
  load();
  setInterval(load, AUTO_REFRESH_MS);
</script>
</body>
</html>
